# WooHolograms 中文语言文件

prefix: "<white>[</white><color:#5EEAD4>WooHolograms</color><white>]</white> "

# 通用状态词（用于消息体的 {state} 占位符替换，避免硬编码中文泄漏到英文环境）
state-enabled: "启用"
state-disabled: "禁用"

# ==================== 通用消息 ====================
general:
  no-permission: "{prefix}<color:#EF4444>你没有权限执行此操作！</color>"
  no-permission-cmd: "{prefix}<color:#EF4444>你没有权限执行此命令！</color>"
  player-only: "{prefix}<color:#EF4444>此命令只能由玩家执行！</color>"
  unknown-command: "{prefix}<color:#EF4444>未知的命令！使用 /wh help 查看帮助。</color>"
  hologram-not-found: "{prefix}<color:#EF4444>未找到名为 {name} 的全息图！</color>"
  hologram-not-exists: "{prefix}<color:#EF4444>全息图 {name} 不存在！</color>"
  hologram-exists: "{prefix}<color:#EF4444>名为 {name} 的全息图已存在！</color>"
  invalid-location: "{prefix}<color:#EF4444>无效的位置！</color>"
  invalid-material: "{prefix}<color:#EF4444>无效的物品材质！</color>"
  invalid-number: "{prefix}<color:#EF4444>无效的数字！</color>"
  invalid-page: "{prefix}<color:#EF4444>无效的页码！</color>"
  invalid-page-number: "{prefix}<color:#EF4444>无效的页码！</color>"
  page-out-of-range: "{prefix}<color:#EF4444>页码必须在 1 到 {max} 之间！</color>"
  line-out-of-range: "{prefix}<color:#EF4444>行号必须在 1 到 {max} 之间！</color>"
  line-invalid: "{prefix}<color:#EF4444>无效的行号！</color>"
  no-content: "{prefix}<color:#EF4444>此全息图没有内容！</color>"
  must-be-number: "{prefix}<color:#EF4444>页码必须是数字！</color>"
  config-reloaded: "{prefix}<color:#10B981>配置已重新加载！</color>"
  plugin-disabled: "{prefix}<color:#EF4444>插件已被禁用！</color>"
  world-not-found: "{prefix}<color:#EF4444>世界 {world} 不存在！</color>"
  world-undefined: "{prefix}<color:#EF4444>无法确定目标世界！</color>"

# ==================== 创建相关 ====================
create:
  success: "{prefix}<color:#10B981>成功创建全息图 {name}！</color>"
  usage: "{prefix}<color:#EF4444>用法: /wh create <名称> [内容]</color>"
  invalid-name: "{prefix}<color:#EF4444>名称 {name} 不合法！只能包含字母、数字、下划线、连字符。</color>"
  failed: "{prefix}<color:#EF4444>创建全息图失败！</color>"
  at-location: "{prefix}<color:#10B981>已在你的位置创建全息图 {name}！</color>"

# ==================== 删除相关 ====================
delete:
  success: "{prefix}<color:#10B981>成功删除全息图 {name}！</color>"
  usage: "{prefix}<color:#EF4444>用法: /wh delete <名称></color>"
  confirm: "{prefix}<color:#F59E0B>确定要删除全息图 {name} 吗？输入 /wh delete {name} 确认。</color>"
  cancelled: "{prefix}<color:#EF4444>删除操作已取消。</color>"

# ==================== 编辑相关 ====================
edit:
  usage: "{prefix}<color:#EF4444>用法: /wh edit <名称> <操作> [参数]</color>"
  line-set: "{prefix}<color:#10B981>已设置第 {line} 行内容！</color>"
  line-added: "{prefix}<color:#10B981>已添加新行！</color>"
  line-removed: "{prefix}<color:#10B981>已删除第 {line} 行！</color>"
  line-inserted: "{prefix}<color:#10B981>已在第 {line} 行插入新内容！</color>"
  position-updated: "{prefix}<color:#10B981>已更新全息图位置！</color>"
  height-set: "{prefix}<color:#10B981>已设置行高为 {height}！</color>"
  range-set: "{prefix}<color:#10B981>已设置显示范围为 {range}！</color>"

# ==================== 列表相关 ====================
list:
  header: "{prefix}<color:#F59E0B>========== 全息图列表 ==========</color>"
  format: "<color:#9CA3AF>- <white>{name}</white> <color:#374151>({type})</color> <color:#9CA3AF>@ {world}, {x}, {y}, {z}</color>"
  line: "<color:#F59E0B>{name}</color> <color:#9CA3AF>- 世界: {world}, 位置: {x}, {y}, {z}</color>"
  empty: "{prefix}<color:#9CA3AF>暂无全息图</color>"
  footer: "{prefix}<color:#F59E0B>总计: {count} 个全息图</color>"
  page-info: "{prefix}<color:#F59E0B>第 {page} 页 / 共 {total} 页</color>"
  page-info-alt: "<color:#F59E0B>第 {page} 页 / 共 {total} 页</color>"

# ==================== 移动相关 ====================
move:
  success: "{prefix}<color:#10B981>已将全息图 {name} 移动到你的位置！</color>"
  usage: "{prefix}<color:#EF4444>用法: /wh movehere <名称></color>"
  here: "{prefix}<color:#10B981>全息图已移动到这里！</color>"
  to-success: "{prefix}<color:#10B981>已将全息图 {name} 移动到 {world} ({x}, {y}, {z})</color>"
  to-usage: "{prefix}<color:#EF4444>用法: /wh moveto <名称> <x> <y> <z> [世界]</color>"

# ==================== 行操作相关 ====================
line:
  usage: "{prefix}<color:#EF4444>用法: /wh addline <名称> <内容></color>"
  added: "{prefix}<color:#10B981>已添加行: {content}</color>"
  set: "{prefix}<color:#10B981>已设置第 {line} 行: {content}</color>"
  removed: "{prefix}<color:#10B981>已移除第 {line} 行</color>"
  inserted: "{prefix}<color:#10B981>已在第 {line} 行插入: {content}</color>"
  invalid-index: "{prefix}<color:#EF4444>无效的行号！</color>"
  offset-set: "{prefix}<color:#10B981>已设置第 {line} 行偏移为 ({ox}, {oy}, {oz})！</color>"
  yaw-set: "{prefix}<color:#10B981>已设置第 {line} 行 yaw 为 {yaw}！</color>"
  pitch-set: "{prefix}<color:#10B981>已设置第 {line} 行 pitch 为 {pitch}！</color>"

# ==================== 页面操作相关 ====================
page:
  usage: "{prefix}<color:#EF4444>用法: /wh page <名称> <add|remove|switch> [页码]</color>"
  added: "{prefix}<color:#10B981>已添加第 {count} 页！</color>"
  added-gui: "{prefix}<color:#10B981>已添加新页面！当前共 {count} 页。</color>"
  add-failed: "{prefix}<color:#EF4444>添加页面失败！</color>"
  removed: "{prefix}<color:#10B981>已删除全息图 {name} 的第 {page} 页！当前共 {count} 页。</color>"
  removed-gui: "{prefix}<color:#10B981>已删除页面！当前共 {count} 页。</color>"
  remove-failed: "{prefix}<color:#EF4444>无法删除最后一页！</color>"
  switched: "{prefix}<color:#10B981>已切换到第 {page} 页！</color>"
  switch-success: "{prefix}<color:#10B981>已切换到第 {page} 页。</color>"
  switch-failed: "{prefix}<color:#EF4444>切换页面失败！</color>"
  swap-success: "{prefix}<color:#10B981>已交换全息图 {name} 的第 {p1} 页和第 {p2} 页！</color>"
  swap-failed: "{prefix}<color:#EF4444>交换页面失败！</color>"
  swap-same: "{prefix}<color:#EF4444>两个页码不能相同！</color>"
  next: "{prefix}<color:#10B981>切换到下一页！</color>"
  prev: "{prefix}<color:#10B981>切换到上一页！</color>"
  no-pages: "{prefix}<color:#EF4444>没有更多页面！</color>"

# ==================== 复制相关 ====================
copy:
  success: "{prefix}<color:#10B981>已将全息图 {source} 复制为 {target}！</color>"
  clone-success: "{prefix}<color:#10B981>成功克隆全息图 {source} 到 {target}！</color>"
  usage: "{prefix}<color:#EF4444>用法: /wh copy <源名称> <目标名称></color>"
  source-not-found: "{prefix}<color:#EF4444>全息图 {source} 不存在！</color>"
  target-exists: "{prefix}<color:#EF4444>全息图 {target} 已存在！</color>"
  failed: "{prefix}<color:#EF4444>克隆全息图失败！</color>"

