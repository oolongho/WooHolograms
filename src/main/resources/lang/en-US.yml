# WooHolograms English Language File

prefix: "<white>[</white><color:#5EEAD4>WooHolograms</color><white>]</white> "

# Common state words (for {state} placeholder in message bodies, avoids hardcoded Chinese leaking into English)
state-enabled: "Enabled"
state-disabled: "Disabled"

# ==================== General ====================
general:
  no-permission: "{prefix}<color:#EF4444>You don't have permission to do this!</color>"
  no-permission-cmd: "{prefix}<color:#EF4444>You don't have permission to execute this command!</color>"
  player-only: "{prefix}<color:#EF4444>This command can only be executed by a player!</color>"
  unknown-command: "{prefix}<color:#EF4444>Unknown command! Use /wh help for help.</color>"
  hologram-not-found: "{prefix}<color:#EF4444>Hologram {name} not found!</color>"
  hologram-not-exists: "{prefix}<color:#EF4444>Hologram {name} does not exist!</color>"
  hologram-exists: "{prefix}<color:#EF4444>Hologram {name} already exists!</color>"
  invalid-location: "{prefix}<color:#EF4444>Invalid location!</color>"
  invalid-material: "{prefix}<color:#EF4444>Invalid material!</color>"
  invalid-number: "{prefix}<color:#EF4444>Invalid number!</color>"
  invalid-page: "{prefix}<color:#EF4444>Invalid page number!</color>"
  invalid-page-number: "{prefix}<color:#EF4444>Invalid page number!</color>"
  page-out-of-range: "{prefix}<color:#EF4444>Page must be between 1 and {max}!</color>"
  line-out-of-range: "{prefix}<color:#EF4444>Line must be between 1 and {max}!</color>"
  line-invalid: "{prefix}<color:#EF4444>Invalid line number!</color>"
  no-content: "{prefix}<color:#EF4444>This hologram has no content!</color>"
  must-be-number: "{prefix}<color:#EF4444>Page must be a number!</color>"
  config-reloaded: "{prefix}<color:#10B981>Configuration reloaded!</color>"
  plugin-disabled: "{prefix}<color:#EF4444>Plugin is disabled!</color>"
  world-not-found: "{prefix}<color:#EF4444>World {world} does not exist!</color>"
  world-undefined: "{prefix}<color:#EF4444>Cannot determine target world!</color>"

# ==================== Create ====================
create:
  success: "{prefix}<color:#10B981>Successfully created hologram {name}!</color>"
  usage: "{prefix}<color:#EF4444>Usage: /wh create <name> [content]</color>"
  invalid-name: "{prefix}<color:#EF4444>Name {name} is invalid! Only letters, digits, underscores and hyphens are allowed.</color>"
  failed: "{prefix}<color:#EF4444>Failed to create hologram!</color>"
  at-location: "{prefix}<color:#10B981>Created hologram {name} at your location!</color>"

# ==================== Delete ====================
delete:
  success: "{prefix}<color:#10B981>Successfully deleted hologram {name}!</color>"
  usage: "{prefix}<color:#EF4444>Usage: /wh delete <name></color>"
  confirm: "{prefix}<color:#F59E0B>Are you sure you want to delete {name}? Type /wh delete {name} to confirm.</color>"
  cancelled: "{prefix}<color:#EF4444>Delete operation cancelled.</color>"

# ==================== Edit ====================
edit:
  usage: "{prefix}<color:#EF4444>Usage: /wh edit <name> <action> [args]</color>"
  line-set: "{prefix}<color:#10B981>Set line {line}!</color>"
  line-added: "{prefix}<color:#10B981>New line added!</color>"
  line-removed: "{prefix}<color:#10B981>Removed line {line}!</color>"
  line-inserted: "{prefix}<color:#10B981>Inserted new line at line {line}!</color>"
  position-updated: "{prefix}<color:#10B981>Hologram position updated!</color>"
  height-set: "{prefix}<color:#10B981>Line height set to {height}!</color>"
  range-set: "{prefix}<color:#10B981>Display range set to {range}!</color>"

# ==================== List ====================
list:
  header: "{prefix}<color:#F59E0B>========== Hologram List ==========</color>"
  format: "<color:#9CA3AF>- <white>{name}</white> <color:#374151>({type})</color> <color:#9CA3AF>@ {world}, {x}, {y}, {z}</color>"
  line: "<color:#F59E0B>{name}</color> <color:#9CA3AF>- World: {world}, Location: {x}, {y}, {z}</color>"
  empty: "{prefix}<color:#9CA3AF>No holograms</color>"
  footer: "{prefix}<color:#F59E0B>Total: {count} holograms</color>"
  page-info: "{prefix}<color:#F59E0B>Page {page} of {total}</color>"
  page-info-alt: "<color:#F59E0B>Page {page} of {total}</color>"

# ==================== Move ====================
move:
  success: "{prefix}<color:#10B981>Moved hologram {name} to your location!</color>"
  usage: "{prefix}<color:#EF4444>Usage: /wh movehere <name></color>"
  here: "{prefix}<color:#10B981>Hologram moved here!</color>"
  to-success: "{prefix}<color:#10B981>Moved hologram {name} to {world} ({x}, {y}, {z})</color>"
  to-usage: "{prefix}<color:#EF4444>Usage: /wh moveto <name> <x> <y> <z> [world]</color>"

# ==================== Line operations ====================
line:
  usage: "{prefix}<color:#EF4444>Usage: /wh addline <name> <content></color>"
  added: "{prefix}<color:#10B981>Added line: {content}</color>"
  set: "{prefix}<color:#10B981>Set line {line}: {content}</color>"
  removed: "{prefix}<color:#10B981>Removed line {line}</color>"
  inserted: "{prefix}<color:#10B981>Inserted at line {line}: {content}</color>"
  invalid-index: "{prefix}<color:#EF4444>Invalid line index!</color>"
  offset-set: "{prefix}<color:#10B981>Set line {line} offset to ({ox}, {oy}, {oz})!</color>"
  yaw-set: "{prefix}<color:#10B981>Set line {line} yaw to {yaw}!</color>"
  pitch-set: "{prefix}<color:#10B981>Set line {line} pitch to {pitch}!</color>"

# ==================== Page operations ====================
page:
  usage: "{prefix}<color:#EF4444>Usage: /wh page <name> <add|remove|switch> [page]</color>"
  added: "{prefix}<color:#10B981>Added page {count}!</color>"
  added-gui: "{prefix}<color:#10B981>Added new page! Total: {count} pages.</color>"
  add-failed: "{prefix}<color:#EF4444>Failed to add page!</color>"
  removed: "{prefix}<color:#10B981>Removed page {page} of hologram {name}! Total: {count} pages.</color>"
  removed-gui: "{prefix}<color:#10B981>Removed page! Total: {count} pages.</color>"
  remove-failed: "{prefix}<color:#EF4444>Cannot remove the last page!</color>"
  switched: "{prefix}<color:#10B981>Switched to page {page}!</color>"
  switch-success: "{prefix}<color:#10B981>Switched to page {page}.</color>"
  switch-failed: "{prefix}<color:#EF4444>Failed to switch page!</color>"
  swap-success: "{prefix}<color:#10B981>Swapped page {p1} and page {p2} of hologram {name}!</color>"
  swap-failed: "{prefix}<color:#EF4444>Failed to swap pages!</color>"
  swap-same: "{prefix}<color:#EF4444>The two page numbers cannot be the same!</color>"
  next: "{prefix}<color:#10B981>Switched to next page!</color>"
  prev: "{prefix}<color:#10B981>Switched to previous page!</color>"
  no-pages: "{prefix}<color:#EF4444>No more pages!</color>"

# ==================== Copy ====================
copy:
  success: "{prefix}<color:#10B981>Copied hologram {source} to {target}!</color>"
  clone-success: "{prefix}<color:#10B981>Successfully cloned hologram {source} to {target}!</color>"
  usage: "{prefix}<color:#EF4444>Usage: /wh copy <source> <target></color>"
  source-not-found: "{prefix}<color:#EF4444>Hologram {source} does not exist!</color>"
  target-exists: "{prefix}<color:#EF4444>Hologram {target} already exists!</color>"
  failed: "{prefix}<color:#EF4444>Failed to clone hologram!</color>"

