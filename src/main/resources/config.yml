# WooHolograms 配置文件
# Configuration file for WooHolograms

# 基本设置
settings:
  # 是否启用调试模式
  debug: false
  # 语言设置 (zh-CN, en-US)
  language: zh-CN
  # 自动保存间隔（秒），0 表示禁用自动保存
  auto-save-interval: 300

# 默认设置
defaults:
  # 默认显示距离（方块）
  display-range: 48
  # 默认更新距离（方块）
  update-range: 48
  # 默认更新间隔（tick），控制占位符/动画文本的自动刷新周期
  # 0 表示禁用自动刷新（静态全息图省性能，大部分全息图推荐 0）
  update-interval: 0
  # 默认行高
  line-height: 0.3
  # 默认文本行高
  text-height: 0.3
  # 默认物品行高
  item-height: 0.6
  # 默认头颅行高
  head-height: 0.6
  # 默认背景透明度 (0=完全透明, 255=完全不透明)
  default-background-alpha: 128
  default-background-color: 0
  # 默认行宽度（像素），控制文本自动换行阈值
  default-line-width: 300
  # 默认 Display Entity 缩放
  default-scale-x: 1.0
  default-scale-y: 1.0
  default-scale-z: 1.0
  # 默认 Display Entity 平移
  default-translation-x: 0.0
  default-translation-y: 0.0
  default-translation-z: 0.0
  # 默认 Display Entity 阴影半径
  default-shadow-radius: 0
  # 默认 Display Entity 阴影强度
  default-shadow-strength: 1.0
  # 默认 Display Entity 发光颜色 (-1 表示不覆盖)
  default-glow-color: -1
  # 默认 Chroma 彩虹色背景
  default-chroma-background: false
  # 默认 Chroma 彩虹色发光
  default-chroma-glow: false

# 性能设置
performance:
  # 渲染任务间隔（tick）
  render-interval: 2
  # 占位符更新间隔（tick）
  placeholder-interval: 40
  # LRU缓存大小
  cache-size: 500
  # 最大每帧更新数量
  max-updates-per-tick: 50

# 动画设置
animation:
  # 是否启用动画
  enabled: true
  # 动画帧间隔（tick）
  frame-interval: 4

# 交互设置
interaction:
  # 是否启用点击交互
  enabled: true
  # 点击冷却（tick）
  click-cooldown: 10

# 限制设置
limits:
  # 每个世界最大全息图数量
  max-holograms-per-world: 100
  # 每个全息图最大行数
  max-lines-per-hologram: 20

# 渲染器缓存池设置
renderer-pool:
  # 是否启用渲染器缓存池
  enabled: true
  # 最大缓存数量
  max-size: 100

# 兼容设置
compat:
  # 是否启用 DecentHolograms 伪装
  # 关闭后其他插件将不再识别 WooHolograms 为 DecentHolograms（需重启生效）
  decentholograms: false

# 安全设置
security:
  # 命令黑名单（禁止通过全息图执行的命令）
  # 这些命令不能通过 COMMAND 或 CONSOLE 动作执行
  command-blacklist:
    - op
    - deop
    - stop
    - reload
    - save-all
    - save-off
    - save-on
    - whitelist
    - ban
    - ban-ip
    - pardon
    - pardon-ip
    - kick
    - execute
    - function
    - debug
    - perf
  # 最大输入长度（用于GUI输入验证）
  max-input-length: 256
