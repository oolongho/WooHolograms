plugins {
    id 'java'
    id 'io.papermc.paperweight.userdev' version '2.0.0-beta.21'
}

paperweight.reobfArtifactConfiguration = io.papermc.paperweight.userdev.ReobfArtifactConfiguration.getMOJANG_PRODUCTION()

group = 'com.oolongho'

version = '1.2.3'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    paperweight.paperDevBundle('1.21.11-R0.1-SNAPSHOT')
    // API 模块：编译期可见，运行期打包进插件 jar
    implementation project(':wooholograms-api')
    compileOnly 'me.clip:placeholderapi:2.11.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand 'project': [version: version]
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'WooHolograms'
    // 先构建 api 模块产物，再将其类打包进插件 jar
    dependsOn ':wooholograms-api:jar'

    // 将 API 子模块的类打包进插件 jar（runtimeClasspath 仅含 api 模块，
    // Paper/PlaceholderAPI 等为 compileOnly 不会被打入）
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes(
            'Built-By': 'Gradle',
            'Build-Jdk': System.getProperty('java.version'),
            'Created-By': 'WooHolograms Build System'
        )
    }
}

tasks.register('buildInfo') {
    doLast {
        println "=========================================="
        println "WooHolograms Build Information"
        println "=========================================="
        println "Version: ${version}"
        println "Java: ${java.sourceCompatibility}"
        println "Paper: 1.21+"
        println "=========================================="
    }
}

build.dependsOn buildInfo
